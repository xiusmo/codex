name: codexx-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: codexx-x86_64-unknown-linux-gnu.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: codexx-aarch64-unknown-linux-gnu.tar.gz
          - runner: macos-13
            target: x86_64-apple-darwin
            archive: codexx-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: codexx-aarch64-apple-darwin.tar.gz
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: codexx-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26
        with:
          targets: ${{ matrix.target }}

      - name: Build codex
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path codex-rs/Cargo.toml \
            -p codex-cli \
            --bin codex \
            --release \
            --target "${{ matrix.target }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "codex-rs/target/${{ matrix.target }}/release/codex" dist/codex
          chmod 0755 dist/codex
          tar -C dist -czf "${{ matrix.archive }}" codex

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "codex-rs/target/${{ matrix.target }}/release/codex.exe" "dist/codex.exe"
          Compress-Archive -Path "dist/codex.exe" -DestinationPath "${{ matrix.archive }}" -Force

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836
        with:
          files: dist/*
          generate_release_notes: true
